<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vrindavan Tulsi Store - Order & Pay</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f7f1e3; 
        color: #333;
        padding: 15px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 520px; 
        background-color: #ffffff;
        padding: 25px 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border-top: 6px solid #e67e22; 
        position: relative;
    }

    .header-image {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product-image-container {
        text-align: center;
        margin: 15px 0;
        display: none;
        animation: fadeIn 0.5s ease-in;
    }

    .product-image-container img {
        width: 180px; height: 180px;
        object-fit: cover; border-radius: 50%;
        border: 4px solid #fdf2e9;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-family: 'Yatra One', cursive; color: #d35400; font-size: 26px; margin-bottom: 5px; }
    .header p { font-size: 14px; color: #666; line-height: 1.4; }

    .section-title {
        background: #fdf2e9; color: #d35400;
        padding: 10px 15px; border-radius: 8px;
        font-size: 15px; font-weight: 600;
        margin: 25px 0 15px 0; display: flex; align-items: center; gap: 8px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #2c3e50; font-weight: 500; }
    .hindi-text { color: #555; font-size: 13px; font-weight: 400; }
    .required { color: #e74c3c; font-weight: bold; }

    input, select, textarea {
        width: 100%; padding: 12px 15px;
        border-radius: 8px; border: 1px solid #dcdde1;
        font-family: inherit; font-size: 14px;
        background-color: #fcfcfc; transition: all 0.3s ease; -webkit-appearance: none; 
    }
    input:focus, select:focus, textarea:focus { border-color: #e67e22; background-color: #fff; outline: none; box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15); }
    textarea { resize: vertical; min-height: 80px; }

    .price-banner {
        background: #e67e22;
        color: white;
        text-align: center;
        padding: 15px;
        font-size: 20px;
        font-weight: 700;
        border-radius: 10px;
        margin-top: 20px;
        display: none;
        box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
    }

    /* Single Checkout Button */
    .btn-pay {
        width: 100%; padding: 18px 20px;
        background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); 
        color: white; border: none; border-radius: 12px;
        font-size: 18px; font-weight: 700; cursor: pointer;
        display: flex; justify-content: center; align-items: center; gap: 12px;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
        margin-top: 20px;
        box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4), 0 0 0 0 rgba(39, 174, 96, 0.2);
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
    }
    .btn-pay::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transition: left 0.4s ease;
    }
    .btn-pay:hover::before { left: 100%; }
    .btn-pay:hover { 
        background: linear-gradient(135deg, #1e8449 0%, #186a3b 100%);
        transform: translateY(-3px); 
        box-shadow: 0 12px 35px rgba(39, 174, 96, 0.5), 0 0 20px rgba(39, 174, 96, 0.3);
    }
    .btn-pay:active { transform: translateY(-1px); }
    .btn-pay:disabled { 
        background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); 
        cursor: not-allowed; transform: none; 
        box-shadow: none; 
        opacity: 0.7;
    }

    .input-error { border-color: #e74c3c !important; background-color: #fdedec !important; }

    @media (max-width: 480px) {
        body { padding: 10px; }
        .container { padding: 20px 15px; }
        .header h1 { font-size: 22px; }
        .btn-pay { font-size: 16px; padding: 14px; }
    }
</style>
</head>
<body>

<div class="container">
    
    <img src="https://thumbs.dreamstime.com/b/holy-wooden-tulsi-garland-prayer-beads-hanging-traditional-market-retail-stall-422550048.jpg" alt="Vrindavan Tulsi Store" class="header-image">

    <div class="header">
        <h1>पवित्र तुलसी माला स्टोर</h1>
        <p>Premium Quality <br><span class="hindi-text">सीधे वृंदावन से आपके घर तक</span></p>
    </div>

    <div class="section-title">🛒 Choose Product (आइटम चुनें)</div>
    <div class="form-group">
        <label>Select Item <span class="required">*</span></label>
        <select id="productCategory" onchange="updateProduct()">
            <option value="" disabled selected>-- एक आइटम चुनें --</option>
            <option value="Sitaram Locket Mala">Sitaram Locket Mala (₹599)</option>
            <option value="Shri Radha Locket Mala">Shri Radha Locket Mala (₹549)</option>
            <option value="Kanthi Mala">Kanthi Mala (₹199)</option>
            <option value="Locket Tulsi Mala">Locket Tulsi Mala (₹299)</option>
            <option value="Jap Mala">Jap Mala 108 Beads (₹399)</option>
            <option value="Brown & Black Tulsi Mala">Brown & Black Tulsi Mala (₹349)</option>
            <option value="Panchmala">Panchmala (₹499)</option>
            <option value="Tulsi Earrings">Tulsi Earrings (₹199)</option>
            <option value="Hanuman Ji Locket Mala">Hanuman Ji Locket Mala (₹249)</option>
            <option value="Bhaktmal Tulsi Locket">Bhaktmal Tulsi Locket (₹699)</option>
            <option value="Hand Bracelets">Hand Bracelets (₹249)</option>
            <option value="Pure Attars">Pure Attars (₹199)</option>
            <option value="Premium Tulsi Jewellery">Premium Tulsi Jewellery (₹899)</option>
            <option value="Jap Bag">Jap Bag (₹199)</option>
            <option value="Tika Chandan & Braj Raj">Tika Chandan & Braj Raj (₹149)</option>
            <option value="Rudraksha Mala">Rudraksha Mala (₹299)</option>
        </select>
    </div>

    <div class="product-image-container" id="productImageDiv">
        <img id="dynamicProductImage" src="" alt="Selected Product">
    </div>

    <div class="section-title" id="customizationTitle" style="display:none;">📿 Customization (आपकी पसंद)</div>

    <div class="form-group" id="group-beadSize" style="display:none;">
        <label>Bead Size <span class="hindi-text">(बड़े दाने: +₹50)</span></label>
        <select id="beadSize" onchange="calculatePrice()">
            <option value="Medium (मीडियम)">Medium Beads (मीडियम दाने)</option>
            <option value="Small (छोटे)">Small Beads (छोटे दाने)</option>
            <option value="Large (बड़े)">Large Beads (बड़े दाने) [+₹50]</option>
        </select>
    </div>

    <div class="form-group" id="group-lengthSize" style="display:none;">
        <label id="label-lengthSize">Neck Size / Length</label>
        <select id="lengthSize">
            <option value="Standard / स्टैंडर्ड">Standard Size (स्टैंडर्ड साइज़)</option>
            <option value="Choker / गले से चिपकी हुई">Choker Style (गले से चिपकी हुई)</option>
            <option value="Chest Level / छाती तक">Chest Level (छाती तक)</option>
        </select>
    </div>

    <div class="form-group" id="group-threadColor" style="display:none;">
        <label>Thread Color <span class="hindi-text">(धागे का रंग)</span></label>
        <select id="threadColor">
            <option value="Red (लाल)">Red (लाल)</option>
            <option value="Yellow (पीला)">Yellow (पीला)</option>
            <option value="Black (काला)">Black (काला)</option>
        </select>
    </div>

    <div class="form-group" id="group-pendant" style="display:none;">
        <label>Extra Pendant <span class="hindi-text">(लॉकेट: +₹100)</span></label>
        <select id="pendant" onchange="calculatePrice()">
            <option value="No Pendant (बिना लॉकेट के)">No Pendant (बिना लॉकेट के)</option>
            <option value="With Pendant (लॉकेट के साथ)">With Pendant (लॉकेट के साथ) [+₹100]</option>
        </select>
    </div>

    <div class="section-title">👤 Contact & Delivery (डिलीवरी)</div>
    
    <div class="form-group">
        <label>Your Full Name <span class="required">*</span></label>
        <input type="text" id="name" placeholder="Enter your name / अपना नाम लिखें" required>
    </div>

    <div class="form-group">
        <label>WhatsApp Number <span class="required">*</span></label>
        <input type="tel" id="phone" placeholder="10 Digit Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
    </div>

    <div class="form-group">
        <label>Full Delivery Address <span class="required">*</span></label>
        <textarea id="address" placeholder="House No, Street, City, State, PIN Code" required></textarea>
    </div>

    <button id="payBtn" class="btn-pay" onclick="processOrderAndPay()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        Pay ₹<span id="btnAmount">0</span> & Place Order
    </button>

</div>

<script>
// Data Base
const basePrices = {
    "Sitaram Locket Mala": 599, "Shri Radha Locket Mala": 549, "Kanthi Mala": 199,
    "Locket Tulsi Mala": 299, "Jap Mala": 399, "Brown & Black Tulsi Mala": 349,
    "Panchmala": 499, "Tulsi Earrings": 199, "Hanuman Ji Locket Mala": 249,
    "Bhaktmal Tulsi Locket": 699, "Hand Bracelets": 249, "Pure Attars": 199,
    "Premium Tulsi Jewellery": 899, "Jap Bag": 199, "Tika Chandan & Braj Raj": 149,
    "Rudraksha Mala": 299
};

const productImages = {
    "Sitaram Locket Mala": "https://thevrindastore.com/cdn/shop/collections/01FFA39E-3657-4224-A6FE-00334951E8DB_13cd0ff4-5303-4cb0-a972-b6e528fe5595.jpg",
    "Shri Radha Locket Mala": "https://thevrindastore.com/cdn/shop/files/8840D14E-D5DF-4C57-8CD2-C80499F91B36.jpg",
    "Kanthi Mala": "https://thevrindastore.com/cdn/shop/collections/D928277A-C3E4-4707-B9F6-E4D6224CB35B_dc82c695-3d6c-4066-aec4-cc731a7087c4.jpg",
    "Locket Tulsi Mala": "https://thevrindastore.com/cdn/shop/files/E96818CC-A657-48CD-96C0-B9B745574E34.jpg",
    "Jap Mala": "https://thevrindastore.com/cdn/shop/files/6699D699-A114-4481-A1BC-64A7D6223DA4.jpg",
    "Brown & Black Tulsi Mala": "https://thevrindastore.com/cdn/shop/files/50CB5291-7A78-4F7B-A055-827837063504.jpg",
    "Panchmala": "https://thevrindastore.com/cdn/shop/collections/581768C7-555B-4B53-BC08-B6787A5CE942_c10434c2-f04d-46e2-901d-70b6f617697e.jpg",
    "Tulsi Earrings": "https://thevrindastore.com/cdn/shop/files/2E845BEB-E3F2-482B-8EBE-01EE55BF62D0.jpg",
    "Hanuman Ji Locket Mala": "https://thevrindastore.com/cdn/shop/files/DD69B9CB-2AE1-4B93-BD8E-3DD56E5DE9C9.jpg",
    "Bhaktmal Tulsi Locket": "https://thevrindastore.com/cdn/shop/files/80F3712E-D7D2-4CE9-B85F-11ACB0FF5D45.jpg",
    "Hand Bracelets": "https://thevrindastore.com/cdn/shop/files/IMG_5411.jpg",
    "Pure Attars": "https://thevrindastore.com/cdn/shop/files/77D23C44-CA73-488D-974F-E13C079DD186.jpg",
    "Premium Tulsi Jewellery": "https://thevrindastore.com/cdn/shop/files/B120077E-703C-4AF0-B797-4B067339B4F7.jpg",
    "Jap Bag": "https://thevrindastore.com/cdn/shop/files/93A1F945-B75A-49ED-A2B4-11427D1E19D1.jpg",
    "Tika Chandan & Braj Raj": "https://thevrindastore.com/cdn/shop/files/9AB8E1D3-15D8-46F9-9EE0-C9B67ACA1D39.jpg",
    "Rudraksha Mala": "https://thevrindastore.com/cdn/shop/collections/430A206D-776B-4445-A3F8-512C1D8EE7FB.jpg"
};

let currentPrice = 0;
const FIREBASE_URL = "https://tulsi-mala-default-rtdb.firebaseio.com/orders.json"; // Data goes to 'orders' node

function updateProduct() {
    let product = document.getElementById("productCategory").value;
    
    if(productImages[product]) {
        document.getElementById("dynamicProductImage").src = productImages[product];
        document.getElementById("productImageDiv").style.display = "block";
    }

    let title = document.getElementById("customizationTitle");
    document.getElementById("group-beadSize").style.display = "none";
    document.getElementById("group-lengthSize").style.display = "none";
    document.getElementById("group-threadColor").style.display = "none";
    document.getElementById("group-pendant").style.display = "none";
    title.style.display = "flex";

    document.getElementById("beadSize").selectedIndex = 0;
    document.getElementById("pendant").selectedIndex = 0;

    let productLower = product.toLowerCase();

    if (productLower.includes("attar") || productLower.includes("bag") || productLower.includes("chandan") || productLower.includes("earring") || productLower.includes("jewellery") || (productLower.includes("locket") && !productLower.includes("mala"))) {
        title.style.display = "none"; 
    } 
    else if (productLower.includes("bracelet")) {
        document.getElementById("group-beadSize").style.display = "block";
        document.getElementById("group-lengthSize").style.display = "block";
        document.getElementById("label-lengthSize").innerHTML = 'Wrist Size <span class="hindi-text">(कलाई का साइज़)</span>';
        document.getElementById("lengthSize").innerHTML = '<option value="Standard">Standard Size (स्टैंडर्ड)</option><option value="Loose">Loose</option><option value="Tight">Tight</option>';
    }
    else {
        document.getElementById("group-beadSize").style.display = "block";
        document.getElementById("group-lengthSize").style.display = "block";
        document.getElementById("group-threadColor").style.display = "block";
        document.getElementById("label-lengthSize").innerHTML = 'Neck Size / Length <span class="hindi-text">(लंबाई)</span>';
        document.getElementById("lengthSize").innerHTML = '<option value="Standard">Standard Size</option><option value="Choker">Choker Style</option><option value="Chest Level">Chest Level</option>';

        if(!productLower.includes("locket")) {
            document.getElementById("group-pendant").style.display = "block";
        }
    }
    calculatePrice();
}

function calculatePrice() {
    let product = document.getElementById("productCategory").value;
    if(!product) {
        document.getElementById("btnAmount").innerText = "0";
        return;
    }

    currentPrice = basePrices[product];

    if(document.getElementById("group-beadSize").style.display !== "none") {
        if(document.getElementById("beadSize").value.includes("Large")) currentPrice += 50;
    }
    if(document.getElementById("group-pendant").style.display !== "none") {
        if(document.getElementById("pendant").value.includes("With Pendant")) currentPrice += 100;
    }

    document.getElementById("btnAmount").innerText = currentPrice;
}

async function processOrderAndPay() {
    let product = document.getElementById("productCategory").value;
    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let address = document.getElementById("address").value.trim();

    // 1. Validation
    let hasError = false;
    document.getElementById("productCategory").classList.remove("input-error");
    document.getElementById("name").classList.remove("input-error");
    document.getElementById("phone").classList.remove("input-error");
    document.getElementById("address").classList.remove("input-error");

    if(!product) { document.getElementById("productCategory").classList.add("input-error"); hasError = true; }
    if(!name) { document.getElementById("name").classList.add("input-error"); hasError = true; }
    if(!phone || phone.length !== 10) { document.getElementById("phone").classList.add("input-error"); alert("Please enter valid 10-digit number."); return; }
    if(!address) { document.getElementById("address").classList.add("input-error"); hasError = true; }

    if(hasError) { alert("Please fill required fields."); return; }

    // Grab customizations
    let customizations = {};
    if(document.getElementById("group-beadSize").style.display !== "none") customizations.beadSize = document.getElementById("beadSize").value;
    if(document.getElementById("group-lengthSize").style.display !== "none") customizations.lengthSize = document.getElementById("lengthSize").value;
    if(document.getElementById("group-threadColor").style.display !== "none") customizations.threadColor = document.getElementById("threadColor").value;
    if(document.getElementById("group-pendant").style.display !== "none") customizations.pendant = document.getElementById("pendant").value;

    let btn = document.getElementById("payBtn");
    let originalBtnHTML = btn.innerHTML;
    btn.innerHTML = "Saving Order... ⏳";
    btn.disabled = true;

    // 2. Prepare Data for Firebase
    let orderData = {
        product: product,
        customer_name: name,
        customer_phone: phone,
        address: address,
        customizations: customizations,
        total_amount: currentPrice,
        payment_status: "Pending", // Initially Pending
        timestamp: new Date().toISOString()
    };

    try {
        // 3. Save to Firebase Realtime Database
        let response = await fetch(FIREBASE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });
        
        let responseData = await response.json();
        let firebaseOrderId = responseData.name; // Firebase creates a unique ID (e.g. "-Nxyz123...")

        // 4. Open Razorpay Checkout
        var options = {
            "key": "rzp_live_SO0ZFBCZTJT9Tu", // Your Razorpay Live Key ID
            "amount": currentPrice * 100, // Amount is in paise
            "currency": "INR",
            "receipt": firebaseOrderId,
            "name": "Vrindavan Tulsi Store",
            "description": "Order: " + product,
            "image": "https://thumbs.dreamstime.com/b/holy-wooden-tulsi-garland-prayer-beads-hanging-traditional-market-retail-stall-422550048.jpg",
            "prefill": {
                "name": name,
                "contact": phone
            },
            "notes": {
                "product": product,
                "customer_name": name,
                "customer_phone": phone,
                "address": address,
                "customizations": JSON.stringify(customizations),
                "order_id": firebaseOrderId
            },
            "theme": { "color": "#27ae60" },
            "handler": async function (rzp_response) {
                // 5. Payment Success -> Update Firebase
                btn.innerHTML = "Confirming Payment... 🟢";
                
                console.log("Payment Success:", rzp_response);
                
                let updateData = {
                    payment_status: "Paid",
                    razorpay_payment_id: rzp_response.razorpay_payment_id,
                    razorpay_order_id: rzp_response.razorpay_order_id,
                    razorpay_signature: rzp_response.razorpay_signature,
                    payment_timestamp: new Date().toISOString()
                };

                let updateUrl = `https://tulsi-mala-default-rtdb.firebaseio.com/orders/${firebaseOrderId}.json`;
                
                try {
                    let updateResponse = await fetch(updateUrl, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updateData)
                    });

                    if(updateResponse.ok) {
                        alert("✅ Order Placed Successfully!\n\nPayment ID: " + rzp_response.razorpay_payment_id + "\n\nThank you for your order! Check your WhatsApp for confirmation.");
                        window.location.reload();
                    }
                } catch(err) {
                    console.error("Firebase Update Error:", err);
                    alert("Payment confirmed but database update failed. Contact support with Payment ID: " + rzp_response.razorpay_payment_id);
                }
            }
        };

        var rzp1 = new Razorpay(options);
        
        // If payment fails or user closes modal, reset button
        rzp1.on('payment.failed', function (response){
            console.log("Payment Failed:", response.error);
            alert("Payment Failed: " + (response.error.description || "Unknown error") + "\n\nPlease try again.");
            btn.innerHTML = originalBtnHTML;
            btn.disabled = false;
        });

        rzp1.open();

    } catch (error) {
        console.error("Error:", error);
        alert("Failed to connect to database. Please check your connection.");
        btn.innerHTML = originalBtnHTML;
        btn.disabled = false;
    }
}
</script>

</body>
</html>
